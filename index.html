<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EYE4 — About Me</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    :root {
      --bg-pink: #fdd3e6;
      --card-bg: #fff5f9;
      --accent-blue: #6e85e8;
      --text-dark: #1e1e24;
      --text-muted: #5a5a66;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background-color: var(--bg-pink);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    /* ================= SPARKLE PARTICLES CANVAS ================= */
    #sparkle-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* ================= TOP LEFT HANDLE ================= */
    .top-handle {
      position: fixed;
      top: 10px;
      left: 14px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-dark);
      z-index: 10;
    }

    /* ================= MAIN WINDOW CARD ================= */
    .card-wrapper {
      position: relative;
      width: 92%;
      max-width: 960px;
      margin: 60px auto;
      z-index: 5;
    }

    /* Decorative Stickers Around Card */
    .sticker {
      position: absolute;
      pointer-events: none;
      z-index: 6;
      object-fit: contain;
    }
    .sticker-top-left {
      top: -62px;
      left: 8px;
      width: 135px;
    }
    .sticker-top-right {
      top: -78px;
      right: 12px;
      width: 110px;
    }
    .sticker-bottom-left {
      bottom: -145px;
      left: 38px;
      width: 75px;
    }
    .sticker-bottom-right {
      bottom: 24px;
      right: 14px;
      width: 90px;
    }

    .window-card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 36px 32px 32px;
      box-shadow: 0 12px 30px rgba(180, 110, 145, 0.18);
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1.15fr 1.15fr;
      gap: 24px;
      min-height: 360px;
    }

    /* Window Controls (- [] X) */
    .window-controls {
      position: absolute;
      top: 10px;
      right: 16px;
      display: flex;
      gap: 12px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      user-select: none;
    }

    /* Bottom-Right Credit (Pyramid Head Corner) */
    .credit-tag {
      position: absolute;
      bottom: 8px;
      right: 14px;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
      opacity: 0.85;
      z-index: 7;
    }

    /* Diamond-Tipped Divider Lines */
    .v-divider {
      position: relative;
      border-left: 2px solid var(--accent-blue);
      padding-left: 24px;
    }

    .v-divider::before,
    .v-divider::after {
      content: "";
      position: absolute;
      left: -5px;
      width: 8px;
      height: 8px;
      border: 2px solid var(--accent-blue);
      background: var(--card-bg);
      transform: rotate(45deg);
    }
    .v-divider::before { top: -4px; }
    .v-divider::after { bottom: -4px; }

    .h-divider {
      position: relative;
      border-top: 2px solid var(--accent-blue);
      margin: 18px 0;
    }

    .h-divider::before,
    .h-divider::after {
      content: "";
      position: absolute;
      top: -5px;
      width: 8px;
      height: 8px;
      border: 2px solid var(--accent-blue);
      background: var(--card-bg);
      transform: rotate(45deg);
    }
    .h-divider::before { left: -4px; }
    .h-divider::after { right: -4px; }

    /* ================= COLUMN 1: PROFILE & BIO ================= */
    .profile-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 22px;
    }

    .pfp {
      width: 78px;
      height: 78px;
      background: #dce3ea;
      border-radius: 6px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .profile-name h1 {
      font-size: 1.5rem;
      font-weight: 800;
      line-height: 1.1;
    }

    .profile-name span {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .bio-text {
      font-size: 1.15rem;
      font-weight: 800;
      line-height: 1.55;
      text-align: center;
      padding-right: 10px;
    }

    /* ================= COLUMN 2: SOCIALS & FRIENDS ================= */
    .col-middle {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .section-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .link-list {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .link-list a {
      text-decoration: none;
      color: var(--text-dark);
      background: rgba(110, 133, 232, 0.14);
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 700;
      transition: background 0.2s, transform 0.15s;
    }

    .link-list a:hover {
      background: var(--accent-blue);
      color: #fff;
      transform: translateY(-2px);
    }

    /* ================= COLUMN 3: MUSIC PLAYER ================= */
    .now-playing {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 8px;
    }

    .song-cover {
      width: 66px;
      height: 66px;
      background: #dce3ea;
      border-radius: 6px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .song-meta h3 {
      font-size: 1.1rem;
      font-weight: 800;
    }

    .song-meta p {
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    /* Scrubber & Play Button */
    .player-controls {
      margin: 14px 0 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .progress-bar {
      width: 100%;
      appearance: none;
      height: 4px;
      background: var(--accent-blue);
      border-radius: 4px;
      outline: none;
      cursor: pointer;
    }

    .progress-bar::-webkit-slider-thumb {
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent-blue);
      cursor: pointer;
    }

    .play-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2.5px solid var(--accent-blue);
      background: transparent;
      color: var(--accent-blue);
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .play-btn:hover {
      background: var(--accent-blue);
      color: #fff;
    }

    /* Playlist */
    .playlist-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .playlist {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-width: 72%;
    }

    .track-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 6px;
      border-bottom: 1.5px solid rgba(110, 133, 232, 0.45);
      cursor: pointer;
      border-radius: 4px;
      transition: background 0.15s;
    }

    .track-item:hover,
    .track-item.active {
      background: rgba(110, 133, 232, 0.15);
    }

    .track-thumb {
      width: 26px;
      height: 26px;
      background: #dce3ea;
      border-radius: 3px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .track-info {
      line-height: 1.1;
    }

    .track-info .t-name {
      font-size: 0.85rem;
      font-weight: 700;
    }

    .track-info .t-artist {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    /* Responsive Mobile Layout */
    @media (max-width: 820px) {
      .window-card {
        grid-template-columns: 1fr;
        padding-bottom: 36px;
      }
      .v-divider {
        border-left: none;
        border-top: 2px solid var(--accent-blue);
        padding-left: 0;
        padding-top: 20px;
      }
      .v-divider::before, .v-divider::after { display: none; }
      .playlist { max-width: 100%; }
      .sticker { display: none; }
    }
  </style>
</head>
