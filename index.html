<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EYE4 — about me</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #fccce4;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: #111;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
    }

    /* ================= SPLASH / FAKE LOADING SCREEN ================= */
    #splash-screen {
      position: fixed;
      inset: 0;
      background-color: #fccce4;
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.6s ease;
    }

    #splash-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .splash-box {
      width: 380px;
      height: 380px;
      border: 2px solid #8c2cf2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .dots {
      display: flex;
      gap: 14px;
    }

    .dot {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background-color: #dff5eb;
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; background-color: #e8e6f0; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.75); opacity: 0.6; }
      40% { transform: scale(1.05); opacity: 1; }
    }

    #enter-btn {
      position: absolute;
      bottom: 115px;
      background: none;
      border: none;
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 0.5px;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease, transform 0.2s ease;
    }

    #enter-btn.visible {
      opacity: 1;
      pointer-events: auto;
    }

    #enter-btn:hover {
      transform: scale(1.08);
    }

    /* ================= DRIFTING BACKGROUND STARS ================= */
    #starfield {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* ================= TOP-LEFT CORNER TAG ================= */
    .top-tag {
      position: fixed;
      top: 6px;
      left: 6px;
      z-index: 20;
      border: 1.5px solid #8c2cf2;
      background: rgba(255, 255, 255, 0.35);
      padding: 2px 8px;
      font-size: 12px;
      color: #222;
      text-decoration: none;
    }

    /* ================= MAIN CARD WRAPPER ================= */
    .card-wrapper {
      position: relative;
      z-index: 10;
      width: 820px;
      max-width: 95vw;
    }

    /* ================= DECORATIVE STICKERS AROUND CARD ================= */
    /* Replace the placeholder divs with <img src="your-sticker.png" class="sticker ..."> */
    .sticker {
      position: absolute;
      z-index: 15;
      pointer-events: none;
    }

    .sticker-top-left {
      top: -68px;
      left: 15px;
      width: 115px;
      height: 75px;
    }

    .sticker-top-right {
      top: -85px;
      right: 30px;
      width: 90px;
      height: 95px;
    }

    .sticker-bottom-left {
      bottom: -95px;
      left: 25px;
      width: 55px;
      height: 98px;
    }

    .sticker-bottom-right {
      bottom: 8px;
      right: 52px;
      width: 85px;
      height: 78px;
      z-index: 16;
    }

    /* Placeholder box styling (remove once you put your own <img> tags) */
    .sticker-placeholder {
      border: 1.5px dashed #7a73e8;
      background: rgba(255, 255, 255, 0.65);
      font-size: 10px;
      color: #555;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      border-radius: 6px;
    }

    /* ================= MAIN FROSTED WINDOW CARD ================= */
    .main-card {
      background: rgba(255, 245, 250, 0.85);
      backdrop-filter: blur(6px);
      border-radius: 18px;
      padding: 28px 46px 26px 32px;
      display: grid;
      grid-template-columns: 1.05fr 1.3fr 1.25fr;
      gap: 20px;
      position: relative;
      box-shadow: 0 8px 30px rgba(180, 100, 140, 0.12);
    }

    /* Fake window controls (- [ ] X) */
    .window-controls {
      position: absolute;
      top: 10px;
      right: 18px;
      display: flex;
      gap: 12px;
      font-size: 13px;
      color: #333;
      font-family: monospace;
    }

    /* Vertical credits on right edge */
    .credits {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%) rotate(-90deg);
      transform-origin: center;
      font-size: 10px;
      color: #333;
      white-space: nowrap;
    }

    /* ================= COLUMN 1: PROFILE & BIO ================= */
    .col-profile {
      display: flex;
      flex-direction: column;
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
    }

    .pfp-box {
      width: 72px;
      height: 72px;
      background-color: #d3d7de;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 18px;
      line-height: 1.15;
      overflow: hidden;
      flex-shrink: 0;
    }

    .pfp-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .name-block h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .name-block span {
      font-size: 13px;
      font-style: italic;
      color: #333;
    }

    .bio-text {
      text-align: center;
      font-weight: 700;
      font-size: 17px;
      line-height: 1.65;
      margin-top: 6px;
    }

    /* ================= DIVIDERS WITH DIAMOND TIPS ================= */
    .v-divider {
      position: relative;
      border-left: 2px solid #7a73e8;
      padding-left: 18px;
    }

    .v-divider::before,
    .v-divider::after {
      content: "";
      position: absolute;
      left: -4.5px;
      width: 7px;
      height: 7px;
      border: 1.5px solid #7a73e8;
      background: #fff5fa;
      transform: rotate(45deg);
    }

    .v-divider::before { top: -4px; }
    .v-divider::after { bottom: -4px; }

    .h-divider {
      position: relative;
      border-top: 2px solid #7a73e8;
      margin: 14px 0;
    }

    .h-divider::before,
    .h-divider::after {
      content: "";
      position: absolute;
      top: -4.5px;
      width: 7px;
      height: 7px;
      border: 1.5px solid #7a73e8;
      background: #fff5fa;
      transform: rotate(45deg);
    }

    .h-divider::before { left: -4px; }
    .h-divider::after { right: -4px; }

    /* ================= COLUMN 2: SOCIALS & FRIENDS ================= */
    .section-title {
      font-size: 17px;
      font-weight: 500;
      margin-bottom: 10px;
    }

    .socials-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      row-gap: 6px;
      font-size: 15px;
      padding-left: 8px;
    }

    .socials-grid a {
      color: #111;
      text-decoration: none;
    }

    .socials-grid a:hover {
      color: #7a73e8;
      text-decoration: underline;
    }

    .friends-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      margin-top: 6px;
    }

    .friends-list {
      list-style: none;
      font-size: 15px;
      line-height: 1.45;
      padding-left: 8px;
    }

    .friends-list.right-col {
      border-left: 2px solid #7a73e8;
      padding-left: 14px;
    }

    /* ================= COLUMN 3: MUSIC & PLAYLIST ================= */
    .now-playing {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 4px;
    }

    .album-art {
      width: 68px;
      height: 68px;
      background-color: #d3d7de;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
      overflow: hidden;
    }

    .album-art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .song-meta h3 {
      font-size: 16px;
      font-weight: 800;
    }

    .song-meta p {
      font-size: 12px;
      color: #333;
      margin-top: 2px;
    }

    /* Scrubber bar */
    .progress-wrap {
      margin: 14px 0 8px;
      display: flex;
      align-items: center;
    }

    #progress-bar {
      -webkit-appearance: none;
      width: 100%;
      height: 2px;
      background: #7a73e8;
      outline: none;
      cursor: pointer;
    }

    #progress-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #7a73e8;
      cursor: pointer;
    }

    .controls-row {
      display: flex;
      justify-content: center;
      margin-bottom: 6px;
    }

    #play-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 2px solid #5c6bc0;
      background: transparent;
      color: #5c6bc0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 12px;
      transition: background 0.2s, color 0.2s;
    }

    #play-btn:hover {
      background: #5c6bc0;
      color: #fff;
    }

    /* Playlist items */
    .playlist {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-top: 6px;
      max-width: 175px; /* Leaves room for bottom-right sticker */
    }

    .track-item {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      padding: 2px;
      border-radius: 4px;
      transition: background 0.15s;
    }

    .track-item:hover,
    .track-item.active {
      background: rgba(122, 115, 232, 0.15);
    }

    .track-thumb {
      width: 32px;
      height: 22px;
      background: #d3d7de;
      flex-shrink: 0;
      overflow: hidden;
    }
